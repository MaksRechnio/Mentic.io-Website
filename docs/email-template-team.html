<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Signup</title>
</head>
<body style="margin:0;padding:0;background:#faf9f6;font-family:'Helvetica Neue',Arial,sans-serif;">

<!-- Outer wrapper -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf9f6;">
<tr><td align="center" style="padding:40px 20px;">

<!-- Card -->
<table role="presentation" width="520" cellpadding="0" cellspacing="0" style="max-width:520px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(0,60,70,0.08);">

  <!-- Header: Dark teal banner -->
  <tr>
    <td style="background:#003c46;padding:32px 40px;text-align:center;">
      <img src="https://mentic.io/images/mentic-icon-mint.png" alt="Mentic" width="40" height="40" style="display:block;margin:0 auto 16px;" />
      <p style="margin:0;font-size:13px;color:#8bf2d3;font-weight:600;letter-spacing:1px;text-transform:uppercase;">New Early Access Signup</p>
    </td>
  </tr>

  <!-- Body: Coral -->
  <tr>
    <td style="background:#ff6b5c;padding:32px 40px;">

      <!-- Info rows -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td style="padding:12px 16px;background:rgba(255,255,255,0.15);border-radius:10px;margin-bottom:8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding-bottom:4px;">Name</td>
              </tr>
              <tr>
                <td style="font-size:17px;color:#003c46;font-weight:700;">{{first_name}} {{last_name}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr><td height="8"></td></tr>
        <tr>
          <td style="padding:12px 16px;background:rgba(255,255,255,0.15);border-radius:10px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding-bottom:4px;">Email</td>
              </tr>
              <tr>
                <td style="font-size:17px;color:#003c46;font-weight:700;">
                  <a href="mailto:{{email}}" style="color:#003c46;text-decoration:none;">{{email}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr><td height="8"></td></tr>
        <tr>
          <td style="padding:12px 16px;background:rgba(255,255,255,0.15);border-radius:10px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding-bottom:4px;">Company</td>
              </tr>
              <tr>
                <td style="font-size:17px;color:#003c46;font-weight:700;">{{company}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr><td height="8"></td></tr>
        <tr>
          <td style="padding:12px 16px;background:rgba(255,255,255,0.15);border-radius:10px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding-bottom:4px;">Signed up at</td>
              </tr>
              <tr>
                <td style="font-size:14px;color:#003c46;font-weight:600;">{{timestamp}}</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

    </td>
  </tr>

  <!-- Footer: Mint accent bar -->
  <tr>
    <td style="background:#8bf2d3;padding:16px 40px;text-align:center;">
      <p style="margin:0;font-size:12px;color:#003c46;font-weight:700;letter-spacing:0.3px;">
        Reply to this email to reach {{email}} directly
      </p>
    </td>
  </tr>

</table>
<!-- /Card -->

</td></tr>
</table>

</body>
</html>
