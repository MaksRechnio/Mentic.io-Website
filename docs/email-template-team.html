<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<!--[if mso]><style>table,td{font-family:'Nunito Sans',Calibri,Arial,sans-serif !important;}</style><![endif]-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap">
</head>
<body style="margin:0;padding:0;background-color:#ffe5e5;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffe5e5;">
<tr><td align="center" style="padding:48px 20px;">

<table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;width:100%;border-radius:18px;overflow:hidden;background-color:#ff6b5c;">

  <!-- Icon + Logo header -->
  <tr>
    <td style="padding:40px 40px 12px;">
      <img src="https://raw.githubusercontent.com/MaksRechnio/Mentic.io-Website/main/public/images/mentic-icon-orange.png" alt="Mentic" width="56" height="56" style="display:block;border:0;outline:none;" />
    </td>
  </tr>
  <tr>
    <td style="padding:0 40px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="vertical-align:middle;"><img src="https://raw.githubusercontent.com/MaksRechnio/Mentic.io-Website/main/public/images/mentic-text-mint.png" alt="mentic" width="140" style="display:block;border:0;outline:none;" /></td>
          <td style="padding-left:12px;font-size:11px;font-weight:700;color:#003c46;letter-spacing:1px;text-transform:uppercase;vertical-align:middle;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">New Signup</td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Content -->
  <tr>
    <td style="padding:0 40px 36px;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">

      <p style="margin:0 0 24px;font-size:28px;font-weight:700;color:#003c46;line-height:1.2;">
        {{first_name}} {{last_name}}
      </p>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="width:48px;height:3px;background-color:#003c46;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
      <div style="height:24px;font-size:0;line-height:0;">&nbsp;</div>

      <p style="margin:0;font-size:12px;font-weight:600;color:#cc5549;text-transform:uppercase;letter-spacing:0.5px;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">Email</p>
      <p style="margin:4px 0 16px;font-size:16px;color:#faf9f6;font-weight:600;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">
        <a href="mailto:{{email}}" style="color:#faf9f6;text-decoration:none;">{{email}}</a>
      </p>

      <p style="margin:0;font-size:12px;font-weight:600;color:#cc5549;text-transform:uppercase;letter-spacing:0.5px;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">Company</p>
      <p style="margin:4px 0 16px;font-size:16px;color:#faf9f6;font-weight:600;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">{{company}}</p>

      <p style="margin:0;font-size:12px;font-weight:600;color:#cc5549;text-transform:uppercase;letter-spacing:0.5px;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">Signed up</p>
      <p style="margin:4px 0 28px;font-size:14px;color:#e8c0c0;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">{{timestamp}}</p>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" style="background-color:#003c46;border-radius:10px;padding:14px 20px;">
            <p style="margin:0;font-size:13px;color:#8bf2d3;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">
              Reply to reach <strong>{{email}}</strong> directly
            </p>
          </td>
        </tr>
      </table>

    </td>
  </tr>

  <!-- Footer -->
  <tr>
    <td style="padding:0 40px 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="border-top:1px solid #cc5549;padding-top:20px;">

          <!-- Social links as styled text -->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:16px;">
            <tr>
              <td style="padding-right:20px;">
                <a href="https://www.instagram.com/mentic.io/" target="_blank" style="color:#003c46;font-size:13px;font-weight:700;text-decoration:none;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">Instagram</a>
              </td>
              <td style="padding-right:20px;">
                <a href="https://www.linkedin.com/company/mentic-io" target="_blank" style="color:#003c46;font-size:13px;font-weight:700;text-decoration:none;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">LinkedIn</a>
              </td>
              <td>
                <a href="https://x.com/Mentic_io" target="_blank" style="color:#003c46;font-size:13px;font-weight:700;text-decoration:none;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">X</a>
              </td>
            </tr>
          </table>

          <p style="margin:0;font-size:12px;color:#cc5549;line-height:1.5;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;">
            &copy; 2026 Mentic &middot; The Autonomous Advertising Agent
          </p>

        </td></tr>
      </table>
    </td>
  </tr>

</table>

</td></tr>
</table>

</body>
</html>
